# Ablation: single disk tile size (448 only).
name: single_scale_448
description: Ablation — only 448px tiles resized to 512.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
