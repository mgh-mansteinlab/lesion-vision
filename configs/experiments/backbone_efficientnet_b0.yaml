# Ablation: lighter EfficientNet vs B3.
name: backbone_efficientnet_b0
description: efficientnet-b0 encoder; increase batch_size if memory allows.
train:
  backbone: efficientnet-b0
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
