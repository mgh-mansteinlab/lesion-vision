# Template for external validation: train on a defined slide list, validate on held-out cohort.
# Copy and fill train_slides / val_slides (or implement filtering in dataset.py).
name: external_val_holdout
description: |
  External validation protocol — document which WSIs are in hold-out set
  (e.g. different processing batch or acquisition date). Implement slide lists
  in code or split file before running.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
protocol:
  holdout_definition: "Define cohort (e.g. batch B, scanner Y); no slide leakage into train tiles."
  document_in: "experiments/EXPERIMENT_LOG.md"
