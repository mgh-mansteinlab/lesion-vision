# Ablation: alternate encoder backbone.
name: backbone_efficientnet_b3
description: Ablation — EfficientNet-B3 encoder instead of ConvNeXt-Base.
train:
  backbone: efficientnet-b3
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 8
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
notes: Reduce per-GPU batch_size if OOM.
