# Paper-aligned baseline: multi-scale tiles (448 + 768), all shifts, compound loss.
name: baseline_multi_scale
description: Primary model configuration matching manuscript Methods.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
notes: |
  10 epochs + warmup 2: quick ablation default. For publication runs, increase epochs (e.g. 100) and warmup (e.g. 5).
  Use class weights from configs/class_weights.json unless overridden. For DDP, set WORLD_SIZE.
