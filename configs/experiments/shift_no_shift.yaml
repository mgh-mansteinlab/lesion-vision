# Ablation: only no_shift grid (no multi-shift augmentation from overlapping grids).
name: shift_no_shift
description: Single spatial grid per tile size; requires TileGen output for no_shift folders.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448, 768]
  shift_type: no_shift
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
