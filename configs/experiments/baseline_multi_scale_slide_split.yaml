# Punch-disjoint variant of the paper baseline: identical to
# baseline_multi_scale except that the 80/20 train/val split is made on
# punch identifiers (split_level: punch) instead of tile paths, so no punch
# contributes tiles to both subsets. The annotated laser-only punch (PVcont)
# is the test set: it is excluded from training AND from validation, so it
# plays no part in early stopping or checkpoint selection.
name: baseline_multi_scale_slide_split
description: Primary model configuration with a punch-disjoint split and an untouched test punch.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 5
  epochs: 100
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
  split_level: punch
  exclude_groups: [PVcont]
notes: |
  Hyperparameters of the last reported checkpoint
  (models/punch_disjoint_run3_deep/model_20260902_100017), trained from
  scratch: no resume and no train_slides curriculum.
  split_level: punch groups every slide of a series (PVcont1..18, cvb1/cvb3, ...)
  into one punch, so a punch is never split across train and val.
  exclude_groups: [PVcont] keeps the test punch out of both train and val;
  validation (early stopping only) is the seed-42 draw of the remaining punches.
  Tiles come from LesionSegmentation/data_tiling_sources (scale_manifest.csv).
  Use class weights from configs/class_weights.json unless overridden. For DDP, set WORLD_SIZE.
