# Punch-disjoint variant of the paper baseline: identical to
# baseline_multi_scale except that the 80/20 split is made on punch
# identifiers (split_level: punch) instead of tile paths, so no punch —
# and therefore no whole-slide image or donor — contributes tiles to both
# subsets. The punch is the analysis unit and the closest available proxy
# for the donor.
name: baseline_multi_scale_slide_split
description: Primary model configuration with a punch-disjoint train/val split.
train:
  backbone: tu-convnext_base
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 5
  epochs: 100
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
  split_level: punch
  holdout_groups: [PVcont]
  exclude_groups: [RH]
notes: |
  Same hyperparameters as baseline_multi_scale; only the split unit changes.
  split_level: punch keeps all whole-slide images of a punch in one subset.
  holdout_groups forces the annotated laser-only punch out of the training pool.
  Use class weights from configs/class_weights.json unless overridden. For DDP, set WORLD_SIZE.
