# Ablation: smaller ConvNeXt encoder (faster, less memory).
name: backbone_convnext_small
description: tu-convnext_small vs ConvNeXt-Base baseline.
train:
  backbone: tu-convnext_small
  img_size: 512
  tile_size: [448, 768]
  shift_type: all
  loss_type: compound
  scheduler_type: cosine
  warmup_epochs: 2
  epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  patience: 10
  augment: true
  weighted_sampling: true
  sampling_alpha: 0.85
  activation_checkpointing: true
  seed: 42
  val_split: 0.2
